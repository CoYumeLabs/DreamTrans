name: Publish tested image artifacts
'on':
  workflow_call:
    inputs:
      product:
        description: 'Independent product: main or yuaction'
        required: true
        type: string
concurrency:
  group: publish-${{ inputs.product }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select verified product artifacts
        run: |
          echo "matrix=$(python3 scripts/ci/images.py matrix "$PRODUCT" --publish)" >> "$GITHUB_OUTPUT"
        env:
          PRODUCT: ${{ inputs.product }}
        id: matrix
  push-platforms:
    name: Push ${{ matrix.component }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify identity and push without rebuilding
        run: |
          python3 scripts/ci/images.py push "$COMPONENT" "$ARCH" "$RUNNER_TEMP/image"
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
      - name: Pass immutable platform digest to promotion
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/digest-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  promote:
    name: Promote complete verified product
    needs:
      - prepare
      - push-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Merge platforms and promote only current product contents
        run: |
          python3 scripts/ci/images.py release "$PRODUCT" "$RUNNER_TEMP/digests"
        env:
          PRODUCT: ${{ inputs.product }}
      - name: Record immutable release references
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ inputs.product }}-${{ github.sha }}
          path: ${{ runner.temp }}/digests/release-images.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
