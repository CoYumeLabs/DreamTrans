name: CI - Code Quality

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an in-flight main/tag publication finish so frequent pushes cannot
  # starve :latest. GitHub still keeps at most one pending run per group, so
  # intermediate queued commits are coalesced to the newest one. PR checks can
  # still cancel superseded runs to avoid wasting CI capacity.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The three verification jobs below (frontend, backend, security scan) are
# independent and run in parallel; publish-image gates on all of them, so the
# split changes wall-clock time, not what a broken commit can publish.
jobs:
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Inject build metadata (frontend)
        run: |
          echo "VITE_APP_COMMIT=${GITHUB_SHA}" >> .env.production
          echo "VITE_APP_BUILD_TIME=$(date -u +%FT%TZ)" >> .env.production
        working-directory: ./frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Verify frontend (shared with local pre-commit checks)
        run: npm run verify:ci
        working-directory: ./frontend
        env:
          VITE_BACKEND_URL: /
          VITE_BACKEND_WS_URL: /

      - name: Verify Moodle extension privacy boundary and builds
        working-directory: ./extension
        run: |
          npm ci
          npm run type-check
          npm test
          npm run build

  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: dreamtrans_test
          POSTGRES_USER: dreamtrans
          POSTGRES_PASSWORD: dreamtrans-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dreamtrans -d dreamtrans_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Check backend formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: ./backend

      - name: Check and download Go modules
        run: |
          go mod tidy -diff
          go mod download
          go mod verify
        working-directory: ./backend

      - name: Verify migration bundle manifest
        run: bash scripts/tests/migration_bundle_test.sh

      - name: Apply migrations to pgvector PostgreSQL
        run: |
          bash scripts/migrate.sh
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            pk_columns text;
          BEGIN
            SELECT string_agg(attribute.attname, ',' ORDER BY key_column.ordinality)
              INTO pk_columns
              FROM pg_constraint AS constraint_record
              CROSS JOIN LATERAL unnest(constraint_record.conkey)
                WITH ORDINALITY AS key_column(attnum, ordinality)
              JOIN pg_attribute AS attribute
                ON attribute.attrelid = constraint_record.conrelid
               AND attribute.attnum = key_column.attnum
             WHERE constraint_record.conrelid = 'provider_models'::regclass
               AND constraint_record.contype = 'p';

            IF pk_columns IS DISTINCT FROM 'provider,model_id' THEN
              RAISE EXCEPTION 'provider_models primary key is %, expected provider,model_id', pk_columns;
            END IF;
          END
          $verify$;
          SQL
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: dreamtrans_test
          PGUSER: dreamtrans
          PGPASSWORD: dreamtrans-ci

      - name: Verify legacy provider model migration
        run: bash scripts/tests/provider_models_migration_test.sh
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: dreamtrans_test
          PGUSER: dreamtrans
          PGPASSWORD: dreamtrans-ci

      - name: Verify legacy model catalog constraint migration
        run: bash scripts/tests/model_catalog_constraints_migration_test.sh
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: dreamtrans_test
          PGUSER: dreamtrans
          PGPASSWORD: dreamtrans-ci

      - name: Verify acquisition source migration replay
        run: bash scripts/tests/acquisition_migration_test.sh
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: dreamtrans_test
          PGUSER: dreamtrans
          PGPASSWORD: dreamtrans-ci

      - name: Lint backend with golangci-lint-action
        # v9.3.0, pinned to the immutable release commit.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m --build-tags=event_worker
          skip-cache: true  # Skip cache to ensure fresh install

      - name: Test backend
        run: go test -v -race -coverprofile=coverage.txt ./...
        working-directory: ./backend
        env:
          DREAMTRANS_TEST_DATABASE_URL: postgres://dreamtrans:dreamtrans-ci@127.0.0.1:5432/dreamtrans_test?sslmode=disable

      - name: Test event worker
        run: go test -v -race -tags=event_worker ./cmd/event-worker
        working-directory: ./backend

      - name: Verify installer fresh lifecycle
        run: scripts/tests/install_fresh_lifecycle_test.sh

      - name: Verify installer administrator lifecycle
        run: scripts/tests/install_admin_update_test.sh

      - name: Backup script checks (mocked docker)
        run: bash scripts/tests/backup_test.sh

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.txt
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true  # Don't fail if codecov is not configured

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        # v0.36.0, pinned by commit instead of a mutable branch or tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Separate job for build verification
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.build-metadata.outputs.build_time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute shared build metadata
        id: build-metadata
        shell: bash
        run: echo "build_time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Build final production image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: |
            dreamtrans-ci:${{ github.sha }}
            ghcr.io/coyumelabs/dreamtrans:ci-${{ github.sha }}
          cache-from: |
            type=gha,scope=dreamtrans-app
            type=gha
          cache-to: type=gha,mode=max,scope=dreamtrans-app
          build-args: |
            VITE_APP_COMMIT=${{ github.sha }}
            VITE_APP_BUILD_TIME=${{ steps.build-metadata.outputs.build_time }}
            VCS_REF=${{ github.sha }}

      - name: Build standalone frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          push: false
          tags: dreamtrans-frontend-ci:${{ github.sha }}
          cache-from: type=gha,scope=dreamtrans-frontend
          cache-to: type=gha,mode=max,scope=dreamtrans-frontend

      - name: Verify final image contents and runtime identity
        run: |
          image="dreamtrans-ci:${GITHUB_SHA}"
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
          test "$configured_user" = "dreamtrans"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "${GITHUB_SHA}"
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test "$(id -u)" -eq 10001
            test -x /app/server
            test -f /app/public/index.html
            command -v pdftotext
            command -v pdfinfo
            command -v pdftoppm
            command -v fc-match
            command -v tesseract
            font_file="$(fc-match -f "%{file}" Helvetica)"
            echo "Helvetica fallback: ${font_file:-missing}"
            test -r "$font_file"
            languages="$(tesseract --list-langs 2>/dev/null)"
            for language in eng chi_sim jpn kor; do
              echo "$languages" | grep -qx "$language"
            done
            test -f /usr/share/dreamtrans/migrations/001_init.sql
            test -f /usr/share/dreamtrans/migrations/012_repair_seed_pricing_precision.sql
            test -f /usr/share/dreamtrans/migrations/013_client_segment_text.sql
            test -f /usr/share/dreamtrans/migrations/014_translation_groups.sql
            test -f /usr/share/dreamtrans/migrations/015_translation_request_results.sql
            test -f /usr/share/dreamtrans/migrations/016_transcript_history_keyset_index.sql
            test -f /usr/share/dreamtrans/migrations/017_cost_plus_models_admin.sql
            test -f /usr/share/dreamtrans/migrations/018_ai_workspace.sql
            test -f /usr/share/dreamtrans/migrations/019_ai_knowledge_production.sql
            test -f /usr/share/dreamtrans/migrations/020_admin_billing_reliability.sql
            test -f /usr/share/dreamtrans/migrations/021_provider_models_primary_key.sql
            test -f /usr/share/dreamtrans/migrations/022_legacy_model_catalog_constraints.sql
            test -r /usr/share/dreamtrans/migrate.sh
            test "$(stat -c %a /usr/share/dreamtrans/migrations)" = "555"
            test "$(stat -c %a /usr/share/dreamtrans/migrations/001_init.sql)" = "444"
            test "$(stat -c %a /usr/share/dreamtrans/migrate.sh)" = "555"
            test -d /app/data
            test -w /app/data
            test ! -e /app/.env
            test ! -e /app/.env.example
            touch /app/data/.write-test
            rm /app/data/.write-test
          '
          container="dreamtrans-ci-health-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e SM_API_KEY=ci-placeholder \
            -e ALLOW_ANONYMOUS_API=true \
            "$image"
          for attempt in $(seq 1 60); do
            if docker exec "$container" \
              wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

      - name: Verify file extraction in the production runtime
        run: |
          artifact_dir="${RUNNER_TEMP}/dreamtrans-extraction-${GITHUB_RUN_ID}"
          mkdir -p "$artifact_dir"
          docker buildx build \
            --target knowledge-extraction-test-binary \
            --cache-from type=gha,scope=dreamtrans-app \
            --output "type=local,dest=${artifact_dir}" \
            .
          test -x "${artifact_dir}/knowledge-extraction.test"
          docker run --rm \
            --user 10001:10001 \
            --entrypoint /tmp/knowledge-extraction.test \
            --mount \
            "type=bind,src=${artifact_dir}/knowledge-extraction.test,dst=/tmp/knowledge-extraction.test,readonly" \
            "dreamtrans-ci:${GITHUB_SHA}" \
            -test.v \
            -test.count=1 \
            -test.timeout=5m \
            -test.run '^TestLinuxKnowledgeExtractionFixtures$'

      - name: Verify legacy appdata permission migration
        run: |
          scripts/tests/install_appdata_permissions_test.sh \
            "dreamtrans-ci:${GITHUB_SHA}"

      - name: Verify Compose migrations and readiness
        run: |
          project="dreamtrans-ci-${GITHUB_RUN_ID}"
          export IMAGE_TAG="ci-${GITHUB_SHA}"
          export BIND_ADDRESS="127.0.0.1"
          export PORT="18085"
          export SM_API_KEY="ci-placeholder"
          export POSTGRES_PASSWORD="ci-postgres-${GITHUB_RUN_ID}"
          export JWT_SECRET="0123456789abcdef0123456789abcdef"
          export JWT_REFRESH_SECRET="fedcba9876543210fedcba9876543210"
          export ALLOW_ANONYMOUS_API="true"
          trap 'docker compose -p "$project" down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose -p "$project" config --quiet
          docker compose -p "$project" up -d
          for attempt in $(seq 1 60); do
            container="$(docker compose -p "$project" ps -q dreamtrans)"
            state="$(docker inspect \
              --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' \
              "$container" 2>/dev/null || true)"
            if [ "$state" = "running healthy" ]; then
              test "$(docker inspect --format '{{.Config.StopTimeout}}' "$container")" = "30"
              test "$(docker inspect --format '{{.Image}}' "$container")" = \
                "$(docker image inspect --format '{{.Id}}' "ghcr.io/coyumelabs/dreamtrans:${IMAGE_TAG}")"
              exit 0
            fi
            if [ "${state%% *}" = exited ] || [ "${state%% *}" = dead ]; then
              docker compose -p "$project" logs --tail=100
              exit 1
            fi
            sleep 2
          done
          docker compose -p "$project" logs --tail=100
          exit 1

      - name: Verify standalone frontend runtime
        run: |
          image="dreamtrans-frontend-ci:${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
          test "$(docker run --rm --entrypoint serve "$image" --version)" = "14.2.6"
          container="dreamtrans-frontend-ci-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" "$image"
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$health" = healthy ]; then
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/ | grep -q 'id="root"'
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/pro | grep -q 'id="pro-root"'
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/pro/admin | grep -q 'id="pro-admin-root"'
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

  # Publication is deliberately downstream of both the source/test gate and
  # the production-image verification gate. A failing push can no longer
  # replace the mutable :latest tag with an unverified image.
  publish-image:
    name: Publish verified application image
    if: github.event_name != 'pull_request'
    needs:
      - frontend
      - backend
      - security-scan
      - build-verification
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      build_time: ${{ needs.build-verification.outputs.build_time }}
    secrets: inherit
