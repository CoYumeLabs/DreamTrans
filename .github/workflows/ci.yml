name: YuAction CI and Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yuaction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuaction
          POSTGRES_PASSWORD: yuaction-test
          POSTGRES_DB: yuaction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yuaction -d yuaction_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer behavior tests
        run: |
          bash -n scripts/install.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Go tests and vet
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://yuaction:yuaction-test@localhost:5432/yuaction_test?sslmode=disable
        run: |
          go test -race ./...
          go vet ./...
      - name: Frontend build and browser tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
  publish:
    name: Publish ${{ matrix.component }}
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${OWNER,,}/yuaction-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=YuAction ${{ matrix.component }}
            org.opencontainers.image.description=Live interaction for classrooms and talks
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: \`sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
  promote:
    name: Update latest after both images succeed
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this is still the current main commit
        id: head
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; keeping SHA images without moving latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote matching frontend and backend
        if: steps.head.outputs.current == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/yuaction-${component}"
            docker buildx imagetools create --tag "${image}:latest" "${image}:sha-${GITHUB_SHA}"
          done
          echo "Published latest for both components at \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
