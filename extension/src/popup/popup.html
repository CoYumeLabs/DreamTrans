<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DreamTrans Moodle Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="mark">S</span>
      <div>
        <strong>Moodle Sync</strong>
        <small>DREAMTRANS // 只在你的浏览器里运行</small>
      </div>
    </header>

    <section class="panel" id="account">
      <div class="head"><span class="label">DreamTrans</span><span id="account-state" class="muted">未登录</span></div>
      <form id="login-form" class="stack">
        <input id="server" placeholder="服务器，如 https://dreamtrans.example.com" autocomplete="url" />
        <input id="email" placeholder="邮箱" autocomplete="username" />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
        <button class="btn primary" type="submit">登录</button>
      </form>
      <div id="account-row" class="row" hidden>
        <span id="account-who"></span>
        <button class="btn quiet small" id="logout" type="button">退出</button>
      </div>
    </section>

    <section class="panel" id="moodle">
      <div class="head"><span class="label">Moodle</span><span id="moodle-state" class="muted">检测中…</span></div>
      <p id="moodle-course" class="course"></p>
      <label class="field">
        <span>同步到 DreamTrans 课程</span>
        <span class="select"><select id="project"><option value="">请先登录</option></select></span>
      </label>
      <div class="options">
        <label class="toggle">
          <input type="checkbox" id="figures" checked />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text"><b>上传含图页面</b><small>约 1024px 渲染图，服务器只做 OCR，图片不保存</small></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="forums" />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text"><b>同步论坛</b><small>公告和讨论区，每个帖子一份；只取标题、时间和正文，不含作者名字和头像</small></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="full" />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text"><b>全量重检</b><small>忽略本地记录重新抓取；服务器按 sha256 去重，不会重复上传</small></span>
        </label>
      </div>
      <div class="actions">
        <button class="btn primary" id="sync" type="button" disabled>同步本课程</button>
        <button class="btn" id="diagnose" type="button" disabled>诊断</button>
        <button class="btn danger" id="cancel" type="button" hidden>停止</button>
      </div>
      <div id="progress" class="progress" hidden>
        <div class="bar"><i></i></div>
        <p id="progress-text"></p>
      </div>
      <div id="summary" class="summary" hidden></div>
    </section>

    <section class="panel" id="report-panel" hidden>
      <div class="head"><span class="label">Moodle 特征表</span><button class="btn quiet small" id="copy-report" type="button">复制 Markdown</button></div>
      <div id="report"></div>
    </section>

    <footer class="foot">
      不做后台轮询 · 只读 · 不上传原文件 · 不同步讨论区和提交物 · 跳过图书馆资源
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
